[project]
name = "pycensus"
version = "1.0.0"
description = "Common-schema loaders for national census sources, ready to drop into a geohierarchy.GeoHierarchy."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Miguel Ureña Pliego" }
]
dependencies = [
    "geohierarchy @ git+https://github.com/CityScope/geohierarchy.git",
    "polars>=1.0.0",
    "geopandas>=0.14.0",
    "pandas>=2.3.3",
    "pyarrow>=15.0.0",
    "pygris>=0.1.6",
    "us>=3.1.0",
    "platformdirs>=4.0.0",
    "requests>=2.0.0",
    "pycountry>=24.6.1",
    "tqdm>=4.0.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
    "py7zr>=0.20.0",
    "numpy>=1.26.0",
    "shapely>=2.0.0",
    "rasterio>=1.3.0",
    "h3>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
    "mapclassify>=2.6.0",
    "ipykernel>=6.0.0",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# GPU is OPTIONAL: nothing here is installed by default and every code path falls back to the CPU when CuPy / a CUDA device is missing (TRANSITLOS_DEVICE=cpu forces it).
gpu = ["cupy-cuda12x>=13.0"]
# RAPIDS (cuDF / cuGraph) is big and pins its own dependency versions: install it in a SEPARATE environment, e.g.
#   python -m venv .venv-rapids && .venv-rapids/bin/pip install cudf-cu12 cugraph-cu12 --extra-index-url=https://pypi.nvidia.com
# and point TRANSITLOS_RAPIDS_PYTHON at that environment's python; the pipeline calls it in a subprocess only when it exists.
rapids = ["cudf-cu12", "cugraph-cu12"]

[tool.hatch.metadata]
allow-direct-references = true   # the sibling packages are git dependencies (github.com/CityScope)
