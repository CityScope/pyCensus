[project]
name = "pycensus"
version = "0.1.0"
description = "Common-schema loaders for national census sources, ready to drop into a geohierarchy.GeoHierarchy."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Miguel Ureña Pliego" }
]
dependencies = [
    "geohierarchy",
    "polars>=1.0.0",
    "geopandas>=0.14.0",
    "pandas>=2.3.3",
    "pyarrow>=15.0.0",
    "pygris>=0.1.6",
    "us>=3.1.0",
    "platformdirs>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
    "mapclassify>=2.6.0",
    "ipykernel>=6.0.0",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
]

[tool.uv.sources]
geohierarchy = { path = "../geohierarchy", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
