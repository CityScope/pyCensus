site_name: pyCensus
site_description: Census and building data in one shared schema
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: false
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            show_if_no_docstring: false
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
nav:
  - Home: index.md
  - "Guide for an AI agent: census for a new city or country, and completing the global census": AGENT_GUIDE_NEW_CITY_OR_COUNTRY.md
