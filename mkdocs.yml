site_name: pyCensus
site_description: Census and building data in one shared schema
site_url: https://cityscope.github.io/pyCensus/
repo_url: https://github.com/CityScope/pyCensus
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: false
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            show_if_no_docstring: false
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
nav:
  - Home: index.md
  - "Guide for an AI agent: census for a new city or country, and completing the global census": AGENT_GUIDE_NEW_CITY_OR_COUNTRY.md
  - "Adding a source (downloader)": CONTRIBUTING_SOURCES.md
  - "Schemas: where each one lives and what it must contain": SCHEMAS.md
  - "Global census columns": GLOBAL_CENSUS_COLUMNS.md
